<!DOCTYPE html>
<html>
<head>
    <title>PDF Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #viewerToolbar {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }

        #viewerToolbar[hidden] {
            display: none;
        }

        #pdfViewer {
            background: #e5e5e5;
            height: 70vh;
            min-height: 300px;
            overflow: auto;
            padding: 16px;
            position: relative;
        }

        .pdf-page {
            margin: 0 auto 16px;
            position: relative;
            width: fit-content;
        }

        .pdf-page canvas {
            background: white;
            box-shadow: 0 1px 5px #0003;
            display: block;
        }

        .pdf-page .ink-layer {
            background: transparent;
            box-shadow: none;
            display: block;
            height: 100%;
            left: 0;
            position: absolute;
            top: 0;
            touch-action: auto;
            width: 100%;
            z-index: 1;
        }

        .text-edit-layer {
            inset: 0;
            pointer-events: none;
            position: absolute;
            z-index: 2;
        }

        .text-run {
            box-sizing: border-box;
            display: none;
            line-height: 1;
            outline: none;
            position: absolute;
            transform-origin: 0 0;
            white-space: pre;
        }

        .text-run.edited {
            background: white;
            display: block;
            pointer-events: none;
        }

        #pdfViewer.text-editing .text-run {
            background: white;
            border: 1px solid #6b90dd;
            border-radius: 2px;
            display: block;
            pointer-events: auto;
        }

        #pdfViewer.text-editing .text-run:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 1px #1677ff;
        }

        .text-run:empty::before {
            color: #777;
            content: attr(data-placeholder);
        }

        #pdfViewer.drawing .ink-layer {
            cursor: crosshair;
            touch-action: none;
        }

        #pdfViewer.erasing .ink-layer {
            cursor: cell;
            touch-action: none;
        }

        #pdfViewer.selecting .ink-layer {
            cursor: crosshair;
            touch-action: none;
        }

        #pdfViewer.placing-text .ink-layer {
            cursor: text;
        }

        #inkColor {
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            height: 36px;
            padding: 2px;
            width: 36px;
        }

        #inkThickness {
            width: 120px;
        }

        #downloadPdf {
            margin-left: auto;
        }

        .page-editor-control {
            opacity: 0;
            pointer-events: none;
            transition: opacity 120ms ease;
            visibility: hidden;
        }

        #pdfViewer.editing .page-editor-control {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .page-remove {
            position: absolute;
            right: 8px;
            top: 8px;
            z-index: 2;
        }

        .page-add {
            display: block;
            margin: 8px auto 0;
            position: relative;
            z-index: 2;
        }

        .pdf-render-page {
            left: 16px;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 16px;
        }

        #pageEditor {
            margin-top: 8px;
        }

        @media (prefers-reduced-motion: reduce) {
            .page-editor-control {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <h2>PDF Viewer</h2>
    <input type="file" id="pdfUpload" accept=".pdf,application/pdf">

    <div id="viewerToolbar" hidden>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <span id="zoomLevel">100%</span>
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="undo" type="button" aria-label="Undo" disabled>Undo</button>
        <button id="redo" type="button" aria-label="Redo" disabled>Redo</button>
        <span id="currentPage" aria-live="polite"></span>
        <button id="drawToggle" type="button" aria-pressed="false">Draw</button>
        <button id="eraseToggle" type="button" aria-pressed="false">Erase</button>
        <button id="selectToggle" type="button" aria-pressed="false">Lasso select</button>
        <button id="textEditToggle" type="button" aria-pressed="false">Edit text</button>
        <button id="addTextToggle" type="button" aria-pressed="false" disabled>Add text</button>
        <label for="inkColor">Color</label>
        <input id="inkColor" type="color" value="#e53935" aria-label="Drawing color">
        <label for="inkThickness">Thickness</label>
        <input id="inkThickness" type="range" min="1" max="12" step="0.5" value="2">
        <output id="inkThicknessValue" for="inkThickness">2 pt</output>
        <button id="downloadPdf" type="button">Download PDF</button>
    </div>
    <div id="pdfViewer" aria-label="PDF pages" hidden></div>

    <br>
    <button id="pageEditorToggle" type="button" aria-expanded="false" disabled>Edit pages</button>
    <div id="pageEditor" hidden>
        <span id="pageCount" aria-live="polite"></span>
    </div>
    <p id="status" role="status" aria-live="polite"></p>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const pdfUpload = document.getElementById("pdfUpload");
        const pdfViewer = document.getElementById("pdfViewer");
        const viewerToolbar = document.getElementById("viewerToolbar");
        const zoomOutButton = document.getElementById("zoomOut");
        const zoomInButton = document.getElementById("zoomIn");
        const undoButton = document.getElementById("undo");
        const redoButton = document.getElementById("redo");
        const zoomLevel = document.getElementById("zoomLevel");
        const currentPageLabel = document.getElementById("currentPage");
        const drawToggle = document.getElementById("drawToggle");
        const eraseToggle = document.getElementById("eraseToggle");
        const selectToggle = document.getElementById("selectToggle");
        const textEditToggle = document.getElementById("textEditToggle");
        const addTextToggle = document.getElementById("addTextToggle");
        const inkColor = document.getElementById("inkColor");
        const inkThickness = document.getElementById("inkThickness");
        const inkThicknessValue = document.getElementById("inkThicknessValue");
        const downloadPdfButton = document.getElementById("downloadPdf");
        const pageEditorToggle = document.getElementById("pageEditorToggle");
        const pageEditor = document.getElementById("pageEditor");
        const pageCount = document.getElementById("pageCount");
        const status = document.getElementById("status");
        const minZoom = 0.4;
        const maxZoom = 2.5;
        const maxHistoryEntries = 50;
        let pdfDocument;
        let pdfStructureBytes;
        let zoom = 1;
        let currentPageIndex = 0;
        let renderGeneration = 0;
        let isUpdating = false;
        let pendingZoomUpdate = false;
        let isDrawing = false;
        let isErasing = false;
        let isSelecting = false;
        let isTextEditing = false;
        let isPlacingText = false;
        let activeStrokeCount = 0;
        let drawingsByPage = [];
        let selectedStrokesByPage = [];
        let textRunsByPage = [];
        let undoHistory = [];
        let redoHistory = [];
        let pdfFileName = "annotated.pdf";

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        function updatePageControls() {
            const count = pdfDocument.getPageCount();
            if (!isUpdating || !pageCount.textContent) {
                pageCount.textContent = `${count} page${count === 1 ? "" : "s"}`;
            }
            if (!isUpdating || !currentPageLabel.textContent) {
                currentPageLabel.textContent = `Page ${currentPageIndex + 1} of ${count}`;
            }
            zoomOutButton.disabled = isUpdating || activeStrokeCount > 0 || zoom <= minZoom;
            zoomInButton.disabled = isUpdating || activeStrokeCount > 0 || zoom >= maxZoom;
            undoButton.disabled = isUpdating || activeStrokeCount > 0 || undoHistory.length === 0;
            redoButton.disabled = isUpdating || activeStrokeCount > 0 || redoHistory.length === 0;
            drawToggle.disabled = isUpdating || activeStrokeCount > 0;
            eraseToggle.disabled = isUpdating || activeStrokeCount > 0;
            selectToggle.disabled = isUpdating || activeStrokeCount > 0;
            textEditToggle.disabled = isUpdating || activeStrokeCount > 0;
            addTextToggle.disabled = isUpdating || activeStrokeCount > 0 || !isTextEditing;
            downloadPdfButton.disabled = isUpdating || activeStrokeCount > 0;
            zoomLevel.textContent = `${Math.round(zoom * 100)}%`;
            pdfViewer.querySelectorAll(".page-editor-control").forEach(button => {
                button.disabled = isUpdating || activeStrokeCount > 0 ||
                    (button.classList.contains("page-remove") && count <= 1);
            });
        }

        function cloneStroke(stroke) {
            return {
                ...stroke,
                points: stroke.points.map(point => ({ ...point }))
            };
        }

        function cloneTextRun(run) {
            return {
                ...run,
                transform: [...run.transform]
            };
        }

        function captureHistoryState() {
            const drawings = drawingsByPage.map(strokes => strokes.map(cloneStroke));
            const selectedStrokeIndexes = selectedStrokesByPage.map((selected, pageIndex) =>
                drawingsByPage[pageIndex].flatMap((stroke, strokeIndex) =>
                    selected.has(stroke) ? [strokeIndex] : []
                )
            );
            return {
                pdfBytes: pdfStructureBytes,
                drawings,
                selectedStrokeIndexes,
                textRuns: textRunsByPage.map(runs =>
                    runs ? runs.map(cloneTextRun) : undefined
                ),
                currentPageIndex
            };
        }

        function recordHistory(state) {
            undoHistory.push(state);
            if (undoHistory.length > maxHistoryEntries) undoHistory.shift();
            redoHistory = [];
            updatePageControls();
        }

        async function restoreHistoryState(state) {
            pdfDocument = await PDFLib.PDFDocument.load(state.pdfBytes);
            pdfStructureBytes = state.pdfBytes;
            drawingsByPage = state.drawings.map(strokes => strokes.map(cloneStroke));
            selectedStrokesByPage = state.selectedStrokeIndexes.map((indexes, pageIndex) =>
                new Set(indexes.map(index => drawingsByPage[pageIndex][index]))
            );
            textRunsByPage = state.textRuns.map(runs =>
                runs ? runs.map(cloneTextRun) : undefined
            );
            currentPageIndex = Math.min(
                state.currentPageIndex,
                pdfDocument.getPageCount() - 1
            );
            await renderPages(currentPageIndex);
        }

        async function changeHistory(source, destination, action) {
            if (!pdfDocument || isUpdating || activeStrokeCount > 0 || !source.length) return;

            const target = source[source.length - 1];
            const current = captureHistoryState();
            isUpdating = true;
            updatePageControls();
            try {
                await restoreHistoryState(target);
                source.pop();
                destination.push(current);
                status.textContent = `${action} completed.`;
            } catch (error) {
                status.textContent = `Unable to ${action.toLowerCase()}: ${error.message}`;
            } finally {
                isUpdating = false;
                updatePageControls();
                if (pendingZoomUpdate) {
                    pendingZoomUpdate = false;
                    await updateDocument(currentPageIndex);
                }
            }
        }

        function findCurrentPageIndex() {
            const pages = pdfViewer.querySelectorAll(".pdf-page:not(.pdf-render-page)");
            if (!pages.length) return currentPageIndex;

            const viewerCenter = pdfViewer.getBoundingClientRect().top + pdfViewer.clientHeight / 2;
            let closestIndex = 0;
            let closestDistance = Infinity;

            pages.forEach((page, index) => {
                const bounds = page.getBoundingClientRect();
                const pageCenter = bounds.top + bounds.height / 2;
                const distance = Math.abs(viewerCenter - pageCenter);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = index;
                }
            });

            return closestIndex;
        }

        function updateCurrentPage() {
            if (!pdfDocument) return;
            currentPageIndex = findCurrentPageIndex();
            updatePageControls();
        }

        function normalizePdfColor(values) {
            const components = Array.from(values || []);
            if (!components.length || components.some(value => !Number.isFinite(Number(value)))) {
                return undefined;
            }

            const normalized = components.map(Number);
            if (normalized.some(value => value > 1)) {
                normalized.forEach((value, index) => {
                    normalized[index] = value / 255;
                });
            }

            let red;
            let green;
            let blue;
            if (normalized.length === 4) {
                const [cyan, magenta, yellow, black] = normalized;
                red = 1 - Math.min(1, cyan + black);
                green = 1 - Math.min(1, magenta + black);
                blue = 1 - Math.min(1, yellow + black);
            } else if (normalized.length >= 3) {
                [red, green, blue] = normalized;
            } else if (normalized.length === 1) {
                [red] = normalized;
                green = red;
                blue = red;
            } else {
                return undefined;
            }

            return `#${[red, green, blue].map(value =>
                Math.round(Math.max(0, Math.min(1, value)) * 255)
                    .toString(16).padStart(2, "0")
            ).join("")}`;
        }

        function extractTextRuns(textContent, operatorList, page) {
            const textItems = textContent.items.filter(item => item.str);
            const textOperations = new Set([
                pdfjsLib.OPS.showText,
                pdfjsLib.OPS.showSpacedText,
                pdfjsLib.OPS.nextLineShowText,
                pdfjsLib.OPS.nextLineSetSpacingShowText
            ]);
            const colors = [];
            const graphicsStateStack = [];
            let fillColor = "#000000";

            operatorList.fnArray.forEach((operation, index) => {
                if (operation === pdfjsLib.OPS.save) {
                    graphicsStateStack.push(fillColor);
                } else if (operation === pdfjsLib.OPS.restore) {
                    fillColor = graphicsStateStack.pop() || fillColor;
                } else if (
                    operation === pdfjsLib.OPS.setFillRGBColor ||
                    operation === pdfjsLib.OPS.setFillColor ||
                    operation === pdfjsLib.OPS.setFillColorN ||
                    operation === pdfjsLib.OPS.setFillCMYKColor
                ) {
                    const color = normalizePdfColor(operatorList.argsArray[index]);
                    if (color) fillColor = color;
                } else if (textOperations.has(operation)) {
                    colors.push(fillColor);
                }
            });
            const colorsMatchItems = colors.length === textItems.length;
            const commonColor = colors.length && colors.every(color => color === colors[0])
                ? colors[0]
                : "#000000";

            return textItems.map((item, index) => {
                const transform = item.transform || [1, 0, 0, 1, 0, 0];
                const style = textContent.styles[item.fontName] || {};
                const fontDetails = page.commonObjs.get(item.fontName);
                const fontSize = Math.max(
                    0.5,
                    Math.hypot(transform[2], transform[3]) || item.height || 12
                );
                return {
                    originalText: item.str,
                    text: item.str,
                    transform,
                    x: transform[4],
                    y: transform[5],
                    width: Math.max(0, item.width || 0),
                    height: Math.max(fontSize, item.height || 0),
                    fontSize,
                    fontFamily: style.fontFamily || "sans-serif",
                    fontName: fontDetails.name || item.fontName || "",
                    bold: Boolean(fontDetails.bold),
                    italic: Boolean(fontDetails.italic),
                    ascent: Number.isFinite(style.ascent) ? style.ascent : 0.8,
                    descent: Number.isFinite(style.descent) ? style.descent : -0.2,
                    rotation: Math.atan2(transform[1], transform[0]),
                    color: colorsMatchItems ? colors[index] : commonColor,
                    edited: false
                };
            });
        }

        function renderTextRuns(layer, pageIndex, viewport) {
            layer.replaceChildren();
            const measureContext = document.createElement("canvas").getContext("2d");
            (textRunsByPage[pageIndex] || []).forEach((run, index) => {
                const span = document.createElement("span");
                const transform = pdfjsLib.Util.transform(viewport.transform, run.transform);
                const fontSize = Math.hypot(transform[2], transform[3]);
                const angle = Math.atan2(transform[1], transform[0]);
                const ascent = fontSize * run.ascent;
                span.className = `text-run${run.edited ? " edited" : ""}`;
                span.dataset.textRunIndex = String(index);
                if (isTextEditing) span.setAttribute("role", "textbox");
                span.setAttribute(
                    "aria-label",
                    run.newText ? "New text" : `Edit PDF text: ${run.originalText}`
                );
                span.contentEditable = String(isTextEditing);
                span.spellcheck = false;
                span.textContent = run.text;
                if (run.newText) span.dataset.placeholder = "Text";
                span.style.left = `${transform[4] + ascent * Math.sin(angle)}px`;
                span.style.top = `${transform[5] - ascent * Math.cos(angle)}px`;
                span.style.fontFamily = run.fontFamily;
                span.style.fontWeight = run.bold ? "bold" : "normal";
                span.style.fontStyle = run.italic ? "italic" : "normal";
                span.style.fontSize = `${fontSize}px`;
                span.style.color = run.color;
                span.style.transform = `rotate(${angle}rad)`;
                function fitSpanToText() {
                    measureContext.font =
                        `${run.italic ? "italic " : ""}${run.bold ? "bold " : ""}` +
                        `${fontSize}px ${run.fontFamily}`;
                    span.style.width = `${Math.max(
                        run.width * viewport.scale,
                        measureContext.measureText(run.text || " ").width
                    ) + 2}px`;
                }
                fitSpanToText();
                span.addEventListener("input", function() {
                    run.text = span.textContent;
                    run.edited = run.text !== run.originalText;
                    span.classList.toggle("edited", run.edited);
                    fitSpanToText();
                    if (textEditHistoryState) {
                        recordHistory(textEditHistoryState);
                        textEditHistoryState = undefined;
                    }
                });
                let textEditHistoryState;
                let textAtFocus;
                span.addEventListener("focus", function() {
                    textAtFocus = run.text;
                    textEditHistoryState = captureHistoryState();
                });
                layer.appendChild(span);
                span.addEventListener("blur", function() {
                    if (textEditHistoryState && run.text !== textAtFocus) {
                        recordHistory(textEditHistoryState);
                    }
                    textEditHistoryState = undefined;
                });
            });
        }

        function setTextEditMode(enabled) {
            isTextEditing = enabled;
            textEditToggle.setAttribute("aria-pressed", String(enabled));
            textEditToggle.textContent = enabled ? "Done editing text" : "Edit text";
            addTextToggle.disabled = !enabled;
            if (!enabled) {
                isPlacingText = false;
                addTextToggle.setAttribute("aria-pressed", "false");
                addTextToggle.textContent = "Add text";
                pdfViewer.classList.remove("placing-text");
            }
            pdfViewer.classList.toggle("text-editing", enabled);
            pdfViewer.querySelectorAll(".text-run").forEach(span => {
                span.contentEditable = String(enabled);
                if (enabled) {
                    span.setAttribute("role", "textbox");
                } else {
                    span.removeAttribute("role");
                }
            });
        }

        async function renderPages(targetPageIndex = currentPageIndex) {
            const generation = ++renderGeneration;
            const renderZoom = zoom;
            const existingPages = pdfViewer.querySelectorAll(".pdf-page:not(.pdf-render-page)");
            const anchorIndex = Math.min(targetPageIndex, existingPages.length - 1);
            const anchorTop = anchorIndex >= 0
                ? existingPages[anchorIndex].getBoundingClientRect().top
                : undefined;
            const stagedPages = [];
            const pdfBytes = await saveAndRefreshDocument();
            if (generation !== renderGeneration) return;

            const loadingTask = pdfjsLib.getDocument({
                data: new Uint8Array(pdfBytes)
            });
            const renderedDocument = await loadingTask.promise;

            if (generation !== renderGeneration) return;

            try {
                for (let index = 0; index < renderedDocument.numPages; index++) {
                    const page = await renderedDocument.getPage(index + 1);
                    if (generation !== renderGeneration) return;

                    const viewport = page.getViewport({ scale: renderZoom });
                    const wrapper = document.createElement("div");
                    const canvas = document.createElement("canvas");
                    const inkCanvas = document.createElement("canvas");
                    const textLayer = document.createElement("div");
                    const removeButton = document.createElement("button");
                    const addButton = document.createElement("button");
                    const context = canvas.getContext("2d");
                    const inkContext = inkCanvas.getContext("2d");
                    const pixelRatio = window.devicePixelRatio || 1;
                    wrapper.className = "pdf-page pdf-render-page";
                    wrapper.dataset.pageIndex = String(index);
                    textLayer.className = "text-edit-layer";
                    canvas.width = Math.ceil(viewport.width);
                    canvas.height = Math.ceil(viewport.height);
                    inkCanvas.className = "ink-layer";
                    inkCanvas.width = Math.ceil(viewport.width * pixelRatio);
                    inkCanvas.height = Math.ceil(viewport.height * pixelRatio);
                    inkCanvas.style.width = `${viewport.width}px`;
                    inkCanvas.style.height = `${viewport.height}px`;
                    inkContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
                    removeButton.className = "page-editor-control page-remove";
                    removeButton.type = "button";
                    removeButton.dataset.pageIndex = String(index);
                    removeButton.setAttribute("aria-label", `Remove page ${index + 1}`);
                    removeButton.textContent = "−";
                    addButton.className = "page-editor-control page-add";
                    addButton.type = "button";
                    addButton.dataset.pageIndex = String(index);
                    addButton.setAttribute("aria-label", `Add a page after page ${index + 1}`);
                    addButton.textContent = "+";
                    wrapper.appendChild(canvas);
                    wrapper.appendChild(inkCanvas);
                    wrapper.appendChild(textLayer);
                    wrapper.appendChild(removeButton);
                    wrapper.appendChild(addButton);
                    pdfViewer.appendChild(wrapper);
                    stagedPages.push(wrapper);
                    await page.render({ canvasContext: context, viewport }).promise;
                    if (textRunsByPage[index] === undefined) {
                        const [textContent, operatorList] = await Promise.all([
                            page.getTextContent(),
                            page.getOperatorList()
                        ]);
                        textRunsByPage[index] = extractTextRuns(textContent, operatorList, page);
                    }
                    redrawInk(inkContext, index, viewport, pixelRatio, selectedStrokesByPage[index]);
                    renderTextRuns(textLayer, index, viewport);
                    addDrawingHandlers(inkCanvas, index, viewport, pixelRatio);
                }

                if (generation !== renderGeneration) return;

                currentPageIndex = Math.min(targetPageIndex, renderedDocument.numPages - 1);
                stagedPages.forEach(page => page.classList.remove("pdf-render-page"));
                pdfViewer.replaceChildren(...stagedPages);
                stagedPages.length = 0;
                if (anchorTop !== undefined) {
                    const newAnchorTop = pdfViewer.children[currentPageIndex].getBoundingClientRect().top;
                    pdfViewer.scrollTop += newAnchorTop - anchorTop;
                }
                updatePageControls();
            } finally {
                stagedPages.forEach(page => page.remove());
            }
        }

        async function saveAndRefreshDocument() {
            const pdfBytes = await pdfDocument.save();
            const refreshedDocument = await PDFLib.PDFDocument.load(pdfBytes);
            pdfDocument = refreshedDocument;
            pdfStructureBytes = pdfBytes;
            return pdfBytes;
        }

        async function updateDocument(targetPageIndex) {
            if (activeStrokeCount > 0) {
                status.textContent = "Finish the current stroke before changing the page view.";
                return;
            }

            isUpdating = true;
            updatePageControls();
            try {
                await renderPages(targetPageIndex);
                status.textContent = "";
            } catch (error) {
                status.textContent = `Unable to update the PDF: ${error.message}`;
            } finally {
                isUpdating = false;
                updatePageControls();
                if (pendingZoomUpdate) {
                    pendingZoomUpdate = false;
                    await updateDocument(currentPageIndex);
                }
            }
        }

        function parseColor(color) {
            return PDFLib.rgb(
                parseInt(color.slice(1, 3), 16) / 255,
                parseInt(color.slice(3, 5), 16) / 255,
                parseInt(color.slice(5, 7), 16) / 255
            );
        }

        function redrawInk(context, pageIndex, viewport, pixelRatio, selectedStrokes = new Set()) {
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            context.clearRect(0, 0, context.canvas.width, context.canvas.height);

            (drawingsByPage[pageIndex] || []).forEach(stroke => {
                const points = stroke.points.map(point =>
                    viewport.convertToViewportPoint(point.x, point.y)
                );
                context.beginPath();
                if (points.length === 1) {
                    context.arc(
                        points[0][0],
                        points[0][1],
                        stroke.thickness * viewport.scale / 2,
                        0,
                        Math.PI * 2
                    );
                    if (selectedStrokes.has(stroke)) {
                        context.fillStyle = "rgba(30, 120, 255, 0.45)";
                        context.fill();
                    }
                    context.fillStyle = stroke.color;
                    context.fill();
                    return;
                }

                context.moveTo(points[0][0], points[0][1]);
                points.slice(1).forEach(point => context.lineTo(point[0], point[1]));
                if (selectedStrokes.has(stroke)) {
                    context.strokeStyle = "rgba(30, 120, 255, 0.55)";
                    context.lineWidth = stroke.thickness * viewport.scale + 6;
                    context.lineCap = "round";
                    context.lineJoin = "round";
                    context.stroke();
                    context.beginPath();
                    context.moveTo(points[0][0], points[0][1]);
                    points.slice(1).forEach(point => context.lineTo(point[0], point[1]));
                }
                context.strokeStyle = stroke.color;
                context.lineWidth = stroke.thickness * viewport.scale;
                context.lineCap = "round";
                context.lineJoin = "round";
                context.stroke();
            });
        }

        function drawLasso(context, points) {
            if (points.length < 2) return;
            context.save();
            context.beginPath();
            context.moveTo(points[0].x, points[0].y);
            points.slice(1).forEach(point => context.lineTo(point.x, point.y));
            context.strokeStyle = "#1677ff";
            context.lineWidth = 2;
            context.setLineDash([6, 4]);
            context.stroke();
            context.restore();
        }

        function strokeContainsPoint(stroke, point, viewport) {
            const points = stroke.points.map(pdfPoint => {
                const [x, y] = viewport.convertToViewportPoint(pdfPoint.x, pdfPoint.y);
                return { x, y };
            });
            const tolerance = 12 + stroke.thickness * viewport.scale / 2;
            if (points.length === 1) {
                return Math.hypot(point.x - points[0].x, point.y - points[0].y) <= tolerance;
            }
            return points.slice(1).some((end, index) =>
                distanceToSegment(point, points[index], end) <= tolerance
            );
        }

        function pointInPolygon(point, polygon) {
            let inside = false;
            for (let index = 0, previous = polygon.length - 1; index < polygon.length; previous = index++) {
                const currentPoint = polygon[index];
                const previousPoint = polygon[previous];
                const crosses = (currentPoint.y > point.y) !== (previousPoint.y > point.y) &&
                    point.x < (previousPoint.x - currentPoint.x) *
                    (point.y - currentPoint.y) /
                    (previousPoint.y - currentPoint.y) + currentPoint.x;
                if (crosses) inside = !inside;
            }
            return inside;
        }

        function segmentsIntersect(firstStart, firstEnd, secondStart, secondEnd) {
            const orientation = (a, b, c) =>
                (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
            const first = orientation(firstStart, firstEnd, secondStart);
            const second = orientation(firstStart, firstEnd, secondEnd);
            const third = orientation(secondStart, secondEnd, firstStart);
            const fourth = orientation(secondStart, secondEnd, firstEnd);
            const epsilon = 1e-8;
            const onSegment = (start, point, end) =>
                point.x >= Math.min(start.x, end.x) - epsilon &&
                point.x <= Math.max(start.x, end.x) + epsilon &&
                point.y >= Math.min(start.y, end.y) - epsilon &&
                point.y <= Math.max(start.y, end.y) + epsilon;

            if (((first > epsilon && second < -epsilon) ||
                (first < -epsilon && second > epsilon)) &&
                ((third > epsilon && fourth < -epsilon) ||
                (third < -epsilon && fourth > epsilon))) return true;
            return (Math.abs(first) <= epsilon && onSegment(firstStart, secondStart, firstEnd)) ||
                (Math.abs(second) <= epsilon && onSegment(firstStart, secondEnd, firstEnd)) ||
                (Math.abs(third) <= epsilon && onSegment(secondStart, firstStart, secondEnd)) ||
                (Math.abs(fourth) <= epsilon && onSegment(secondStart, firstEnd, secondEnd));
        }

        function strokeIntersectsLasso(stroke, lasso, viewport) {
            const points = stroke.points.map(pdfPoint => {
                const [x, y] = viewport.convertToViewportPoint(pdfPoint.x, pdfPoint.y);
                return { x, y };
            });
            if (points.some(point => pointInPolygon(point, lasso))) return true;

            for (let strokeIndex = 1; strokeIndex < points.length; strokeIndex++) {
                for (let lassoIndex = 0; lassoIndex < lasso.length; lassoIndex++) {
                    if (segmentsIntersect(
                        points[strokeIndex - 1],
                        points[strokeIndex],
                        lasso[lassoIndex],
                        lasso[(lassoIndex + 1) % lasso.length]
                    )) return true;
                }
            }
            return false;
        }

        function addDrawingHandlers(canvas, pageIndex, viewport, pixelRatio) {
            const context = canvas.getContext("2d");
            let activePointerId;
            let isErasingPointer = false;
            let isSelectingPointer = false;
            let gestureHistoryState;
            let eraseHistoryRecorded = false;
            let stroke;
            let lastEraserPoint;
            let lassoPoints;
            let selectedStrokeOrigins;
            let dragStart;

            function getPosition(event) {
                const bounds = canvas.getBoundingClientRect();
                const x = (event.clientX - bounds.left) * viewport.width / bounds.width;
                const y = (event.clientY - bounds.top) * viewport.height / bounds.height;
                const [pdfX, pdfY] = viewport.convertToPdfPoint(x, y);
                return { x, y, pdfX, pdfY };
            }

            canvas.parentElement.addEventListener("click", function(event) {
                if (!isTextEditing || !isPlacingText || isUpdating ||
                    event.target.closest(".page-editor-control")) return;
                const bounds = canvas.getBoundingClientRect();
                if (
                    event.clientX < bounds.left || event.clientX > bounds.right ||
                    event.clientY < bounds.top || event.clientY > bounds.bottom
                ) return;

                const position = getPosition(event);
                const fontSize = 16;
                const newRun = {
                    originalText: "",
                    text: "",
                    transform: [fontSize, 0, 0, fontSize, position.pdfX, position.pdfY],
                    x: position.pdfX,
                    y: position.pdfY,
                    width: 0,
                    height: fontSize,
                    fontSize,
                    fontFamily: "sans-serif",
                    fontName: "Helvetica",
                    bold: false,
                    italic: false,
                    ascent: 0.8,
                    descent: -0.2,
                    rotation: 0,
                    color: inkColor.value,
                    edited: false,
                    newText: true
                };
                recordHistory(captureHistoryState());
                textRunsByPage[pageIndex].push(newRun);
                const textLayer = canvas.parentElement.querySelector(".text-edit-layer");
                renderTextRuns(textLayer, pageIndex, viewport);
                const newTextSpan = textLayer.lastElementChild;
                newTextSpan.focus();
                isPlacingText = false;
                addTextToggle.setAttribute("aria-pressed", "false");
                addTextToggle.textContent = "Add text";
                pdfViewer.classList.remove("placing-text");
                status.textContent = "Type the new text in the selected box.";
            });

            canvas.addEventListener("pointerdown", function(event) {
                if ((!isDrawing && !isErasing && !isSelecting) || isUpdating ||
                    !event.isPrimary || activePointerId !== undefined) return;
                event.preventDefault();
                activePointerId = event.pointerId;
                canvas.setPointerCapture(event.pointerId);
                isErasingPointer = isErasing;
                isSelectingPointer = isSelecting;
                gestureHistoryState = captureHistoryState();
                eraseHistoryRecorded = false;
                activeStrokeCount++;
                updatePageControls();
                if (isErasingPointer) {
                    lastEraserPoint = getPosition(event);
                    if (eraseAt(pageIndex, lastEraserPoint, viewport, pixelRatio)) {
                        recordHistory(gestureHistoryState);
                        eraseHistoryRecorded = true;
                    }
                    return;
                }
                if (isSelectingPointer) {
                    const point = getPosition(event);
                    const selected = selectedStrokesByPage[pageIndex] || new Set();
                    const hitStroke = [...selected].find(selectedStroke =>
                        strokeContainsPoint(selectedStroke, point, viewport)
                    );
                    if (hitStroke) {
                        selectedStrokeOrigins = new Map(
                            [...selected].map(selectedStroke => [
                                selectedStroke,
                                selectedStroke.points.map(pdfPoint => ({ ...pdfPoint }))
                            ])
                        );
                        dragStart = point;
                    } else {
                        selectedStrokesByPage[pageIndex] = new Set();
                        selectedStrokeOrigins = undefined;
                        dragStart = undefined;
                        lassoPoints = [point];
                        redrawInk(context, pageIndex, viewport, pixelRatio);
                        drawLasso(context, lassoPoints);
                    }
                    return;
                }

                const point = getPosition(event);
                stroke = {
                    color: inkColor.value,
                    thickness: Number(inkThickness.value),
                    points: [point]
                };
                context.beginPath();
                context.arc(point.x, point.y, stroke.thickness * viewport.scale / 2, 0, Math.PI * 2);
                context.fillStyle = stroke.color;
                context.fill();
            });

            canvas.addEventListener("pointermove", function(event) {
                if (event.pointerId !== activePointerId) return;
                event.preventDefault();
                const point = getPosition(event);
                if (isErasingPointer) {
                    const distance = Math.hypot(
                        point.x - lastEraserPoint.x,
                        point.y - lastEraserPoint.y
                    );
                    const steps = Math.max(1, Math.ceil(distance / 8));
                    let erased = false;
                    for (let step = 1; step <= steps; step++) {
                        const ratio = step / steps;
                        erased = eraseAt(pageIndex, {
                            ...point,
                            x: lastEraserPoint.x + (point.x - lastEraserPoint.x) * ratio,
                            y: lastEraserPoint.y + (point.y - lastEraserPoint.y) * ratio
                        }, viewport, pixelRatio) || erased;
                    }
                    if (erased && !eraseHistoryRecorded) {
                        recordHistory(gestureHistoryState);
                        eraseHistoryRecorded = true;
                    }
                    lastEraserPoint = point;
                    return;
                }
                if (isSelectingPointer) {
                    if (selectedStrokeOrigins) {
                        const deltaX = point.pdfX - dragStart.pdfX;
                        const deltaY = point.pdfY - dragStart.pdfY;
                        selectedStrokeOrigins.forEach((origins, selectedStroke) => {
                            selectedStroke.points = origins.map(origin => ({
                                x: origin.x + deltaX,
                                y: origin.y + deltaY
                            }));
                        });
                        redrawInk(
                            context,
                            pageIndex,
                            viewport,
                            pixelRatio,
                            selectedStrokesByPage[pageIndex]
                        );
                    } else {
                        lassoPoints.push(point);
                        redrawInk(context, pageIndex, viewport, pixelRatio);
                        drawLasso(context, lassoPoints);
                    }
                    return;
                }
                if (!stroke) return;

                const previousPoint = stroke.points[stroke.points.length - 1];
                stroke.points.push(point);
                context.beginPath();
                context.moveTo(previousPoint.x, previousPoint.y);
                context.lineTo(point.x, point.y);
                context.strokeStyle = stroke.color;
                context.lineWidth = stroke.thickness * viewport.scale;
                context.lineCap = "round";
                context.lineJoin = "round";
                context.stroke();
            });

            async function finishStroke(event) {
                if (event.pointerId !== activePointerId) return;
                event.preventDefault();
                if (isErasingPointer) {
                    activePointerId = undefined;
                    lastEraserPoint = undefined;
                    isErasingPointer = false;
                    gestureHistoryState = undefined;
                    eraseHistoryRecorded = false;
                    activeStrokeCount--;
                    updatePageControls();
                    return;
                }
                if (isSelectingPointer) {
                    if (selectedStrokeOrigins) {
                        const moved = [...selectedStrokeOrigins].some(([selectedStroke, origins]) =>
                            selectedStroke.points.some((point, index) =>
                                point.x !== origins[index].x || point.y !== origins[index].y
                            )
                        );
                        if (moved) recordHistory(gestureHistoryState);
                        status.textContent =
                            `Moved ${selectedStrokeOrigins.size} selected drawing${selectedStrokeOrigins.size === 1 ? "" : "s"}.`;
                    } else {
                        const selection = new Set();
                        if (lassoPoints.length > 2) {
                            (drawingsByPage[pageIndex] || []).forEach(candidate => {
                                if (strokeIntersectsLasso(candidate, lassoPoints, viewport)) {
                                    selection.add(candidate);
                                }
                            });
                        }
                        selectedStrokesByPage[pageIndex] = selection;
                        redrawInk(context, pageIndex, viewport, pixelRatio, selection);
                        status.textContent = selection.size
                            ? `${selection.size} drawing${selection.size === 1 ? "" : "s"} selected. Drag a selected drawing to move it.`
                            : "No drawings selected.";
                    }
                    activePointerId = undefined;
                    isSelectingPointer = false;
                    lassoPoints = undefined;
                    selectedStrokeOrigins = undefined;
                    dragStart = undefined;
                    gestureHistoryState = undefined;
                    activeStrokeCount--;
                    updatePageControls();
                    return;
                }
                if (!stroke) return;

                const completedStroke = stroke;
                const finalPoint = getPosition(event);
                const previousPoint = completedStroke.points[completedStroke.points.length - 1];
                if (finalPoint.x !== previousPoint.x || finalPoint.y !== previousPoint.y) {
                    completedStroke.points.push(finalPoint);
                    context.beginPath();
                    context.moveTo(previousPoint.x, previousPoint.y);
                    context.lineTo(finalPoint.x, finalPoint.y);
                    context.strokeStyle = completedStroke.color;
                    context.lineWidth = completedStroke.thickness * viewport.scale;
                    context.lineCap = "round";
                    context.lineJoin = "round";
                    context.stroke();
                }
                stroke = undefined;
                activePointerId = undefined;

                try {
                    const savedStroke = {
                        color: completedStroke.color,
                        thickness: completedStroke.thickness,
                        points: completedStroke.points.map(point => ({ x: point.pdfX, y: point.pdfY }))
                    };
                    const strokes = drawingsByPage[pageIndex] || [];
                    recordHistory(gestureHistoryState);
                    strokes.push(savedStroke);
                    drawingsByPage[pageIndex] = strokes;
                    status.textContent = "Drawing added. Download the PDF to save your changes.";
                } catch (error) {
                    status.textContent = `Unable to add drawing: ${error.message}`;
                } finally {
                    isErasingPointer = false;
                    gestureHistoryState = undefined;
                    eraseHistoryRecorded = false;
                    activeStrokeCount--;
                    updatePageControls();
                }
            }

            canvas.addEventListener("pointerup", finishStroke);
            canvas.addEventListener("pointercancel", finishStroke);
        }

        function distanceToSegment(point, start, end) {
            const deltaX = end.x - start.x;
            const deltaY = end.y - start.y;
            const lengthSquared = deltaX * deltaX + deltaY * deltaY;
            if (lengthSquared === 0) return Math.hypot(point.x - start.x, point.y - start.y);

            const projection = Math.max(0, Math.min(1,
                ((point.x - start.x) * deltaX + (point.y - start.y) * deltaY) / lengthSquared
            ));
            return Math.hypot(
                point.x - (start.x + projection * deltaX),
                point.y - (start.y + projection * deltaY)
            );
        }

        function eraseAt(pageIndex, position, viewport, pixelRatio) {
            const strokes = drawingsByPage[pageIndex] || [];
            const selectedStrokes = selectedStrokesByPage[pageIndex] || new Set();
            const eraserRadius = 12;
            let erasedCount = 0;
            const remainingStrokes = strokes.filter(stroke => {
                const points = stroke.points.map(point => {
                    const [x, y] = viewport.convertToViewportPoint(point.x, point.y);
                    return { x, y };
                });
                const hitRadius = eraserRadius + stroke.thickness * viewport.scale / 2;
                if (points.length === 1) {
                    if (Math.hypot(position.x - points[0].x, position.y - points[0].y) <= hitRadius) {
                        erasedCount++;
                        selectedStrokes.delete(stroke);
                        return false;
                    }
                    return true;
                }
                for (let pointIndex = 1; pointIndex < points.length; pointIndex++) {
                    if (distanceToSegment(position, points[pointIndex - 1], points[pointIndex]) <= hitRadius) {
                        erasedCount++;
                        selectedStrokes.delete(stroke);
                        return false;
                    }
                }
                return true;
            });
            if (erasedCount === 0) return false;

            drawingsByPage[pageIndex] = remainingStrokes;
            const page = pdfViewer.querySelector(`.pdf-page[data-page-index="${pageIndex}"]`);
            if (page) {
                const inkCanvas = page.querySelector(".ink-layer");
                redrawInk(
                    inkCanvas.getContext("2d"),
                    pageIndex,
                    viewport,
                    window.devicePixelRatio || 1,
                    selectedStrokes
                );
            }
            status.textContent = `${erasedCount} drawing${erasedCount === 1 ? "" : "s"} erased.`;
            return true;
        }

        function drawStrokesOnPdf(page, strokes) {
            strokes.forEach(stroke => {
                const color = parseColor(stroke.color);
                if (stroke.points.length === 1) {
                    page.drawCircle({
                        x: stroke.points[0].x,
                        y: stroke.points[0].y,
                        size: stroke.thickness / 2,
                        color
                    });
                    return;
                }

                const pathOperators = [
                    PDFLib.pushGraphicsState(),
                    PDFLib.setLineCap(PDFLib.LineCapStyle.Round),
                    PDFLib.setLineJoin(PDFLib.LineJoinStyle.Round),
                    PDFLib.setLineWidth(stroke.thickness),
                    PDFLib.setStrokingColor(color),
                    PDFLib.moveTo(stroke.points[0].x, stroke.points[0].y),
                    ...stroke.points.slice(1).map(point => PDFLib.lineTo(point.x, point.y)),
                    PDFLib.stroke(),
                    PDFLib.popGraphicsState()
                ];
                page.pushOperators(...pathOperators);
            });
        }

        function standardFontForRun(run) {
            const family = `${run.fontFamily} ${run.fontName}`.toLowerCase();
            const bold = run.bold || /bold|black|heavy|demi/.test(family);
            const italic = run.italic || /italic|oblique/.test(family);
            if (/mono|courier|code/.test(family)) {
                if (bold && italic) return PDFLib.StandardFonts.CourierBoldOblique;
                if (bold) return PDFLib.StandardFonts.CourierBold;
                if (italic) return PDFLib.StandardFonts.CourierOblique;
                return PDFLib.StandardFonts.Courier;
            }
            if (/serif|times|georgia/.test(family) && !/sans-serif/.test(family)) {
                if (bold && italic) return PDFLib.StandardFonts.TimesRomanBoldItalic;
                if (bold) return PDFLib.StandardFonts.TimesRomanBold;
                if (italic) return PDFLib.StandardFonts.TimesRomanItalic;
                return PDFLib.StandardFonts.TimesRoman;
            }
            if (bold && italic) return PDFLib.StandardFonts.HelveticaBoldOblique;
            if (bold) return PDFLib.StandardFonts.HelveticaBold;
            if (italic) return PDFLib.StandardFonts.HelveticaOblique;
            return PDFLib.StandardFonts.Helvetica;
        }

        async function drawTextEditsOnPdf(document, page, runs, embeddedFonts) {
            for (const run of runs) {
                if (!run.edited) continue;

                const fontName = standardFontForRun(run);
                if (!embeddedFonts.has(fontName)) {
                    embeddedFonts.set(fontName, await document.embedFont(fontName));
                }
                const font = embeddedFonts.get(fontName);
                const textWidth = font.widthOfTextAtSize(run.text, run.fontSize);
                const maskWidth = Math.max(run.width, textWidth) +
                    Math.max(0.5, run.fontSize * 0.06);
                const maskHeight = Math.max(
                    run.height,
                    run.fontSize * (run.ascent - run.descent)
                );
                page.drawRectangle({
                    x: run.x,
                    y: run.y + Math.min(0, run.descent * run.fontSize),
                    width: maskWidth,
                    height: maskHeight,
                    color: PDFLib.rgb(1, 1, 1),
                    rotate: PDFLib.degrees(-run.rotation * 180 / Math.PI)
                });
                if (run.text) {
                    page.drawText(run.text, {
                        x: run.x,
                        y: run.y,
                        font,
                        size: run.fontSize,
                        color: parseColor(run.color),
                        rotate: PDFLib.degrees(-run.rotation * 180 / Math.PI)
                    });
                }
            }
        }

        pdfUpload.addEventListener("change", async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
                status.textContent = "Please choose a PDF file.";
                return;
            }

            try {
                pdfDocument = await PDFLib.PDFDocument.load(await file.arrayBuffer());
                pdfStructureBytes = await pdfDocument.save();
                pdfFileName = file.name.replace(/\.pdf$/i, "") + "-annotated.pdf";
                drawingsByPage = Array.from({ length: pdfDocument.getPageCount() }, () => []);
                selectedStrokesByPage = Array.from({ length: pdfDocument.getPageCount() }, () => new Set());
                textRunsByPage = Array.from({ length: pdfDocument.getPageCount() });
                undoHistory = [];
                redoHistory = [];
                currentPageIndex = 0;
                zoom = 1;
                setTextEditMode(false);
                drawToggle.setAttribute("aria-pressed", "false");
                drawToggle.textContent = "Draw";
                eraseToggle.setAttribute("aria-pressed", "false");
                eraseToggle.textContent = "Erase";
                selectToggle.setAttribute("aria-pressed", "false");
                selectToggle.textContent = "Lasso select";
                isDrawing = false;
                isErasing = false;
                isSelecting = false;
                pdfViewer.classList.remove("drawing");
                pdfViewer.classList.remove("erasing");
                pdfViewer.classList.remove("selecting");
                viewerToolbar.hidden = false;
                pdfViewer.hidden = false;
                pageEditorToggle.disabled = false;
                await updateDocument(0);
            } catch (error) {
                pdfDocument = undefined;
                pdfViewer.replaceChildren();
                pdfViewer.hidden = true;
                viewerToolbar.hidden = true;
                pageEditorToggle.disabled = true;
                status.textContent = `Unable to open this PDF: ${error.message}`;
            }
        });

        pdfViewer.addEventListener("scroll", updateCurrentPage, { passive: true });

        undoButton.addEventListener("click", function() {
            void changeHistory(undoHistory, redoHistory, "Undo");
        });

        redoButton.addEventListener("click", function() {
            void changeHistory(redoHistory, undoHistory, "Redo");
        });

        pdfViewer.addEventListener("wheel", function(event) {
            if (!event.ctrlKey || !pdfDocument) return;

            event.preventDefault();
            if (activeStrokeCount > 0 || event.deltaY === 0) return;

            currentPageIndex = findCurrentPageIndex();
            const deltaMultiplier = event.deltaMode === WheelEvent.DOM_DELTA_LINE
                ? 16
                : event.deltaMode === WheelEvent.DOM_DELTA_PAGE ? pdfViewer.clientHeight : 1;
            const zoomDelta = event.deltaY * deltaMultiplier;
            const previousZoom = zoom;
            zoom = Math.max(minZoom, Math.min(maxZoom, zoom * Math.exp(-zoomDelta * 0.0015)));
            if (zoom === previousZoom) return;
            if (isUpdating) {
                pendingZoomUpdate = true;
                updatePageControls();
                return;
            }
            void updateDocument(currentPageIndex);
        }, { passive: false });

        zoomOutButton.addEventListener("click", async function() {
            if (zoom <= minZoom || isUpdating) return;
            currentPageIndex = findCurrentPageIndex();
            zoom = Math.max(minZoom, Math.round((zoom - 0.2) * 10) / 10);
            await updateDocument(currentPageIndex);
        });

        zoomInButton.addEventListener("click", async function() {
            if (zoom >= maxZoom || isUpdating) return;
            currentPageIndex = findCurrentPageIndex();
            zoom = Math.min(maxZoom, Math.round((zoom + 0.2) * 10) / 10);
            await updateDocument(currentPageIndex);
        });

        pageEditorToggle.addEventListener("click", function() {
            const isExpanded = pageEditorToggle.getAttribute("aria-expanded") === "true";
            pageEditor.hidden = isExpanded;
            pdfViewer.classList.toggle("editing", !isExpanded);
            pageEditorToggle.setAttribute("aria-expanded", String(!isExpanded));
        });

        textEditToggle.addEventListener("click", function() {
            const enabled = !isTextEditing;
            if (enabled) {
                isDrawing = false;
                isErasing = false;
                isSelecting = false;
                drawToggle.setAttribute("aria-pressed", "false");
                drawToggle.textContent = "Draw";
                eraseToggle.setAttribute("aria-pressed", "false");
                eraseToggle.textContent = "Erase";
                selectToggle.setAttribute("aria-pressed", "false");
                selectToggle.textContent = "Lasso select";
                pdfViewer.classList.remove("drawing", "erasing", "selecting");
            }
            setTextEditMode(enabled);

            if (enabled && !textRunsByPage.some(runs => runs && runs.length)) {
                status.textContent =
                    "No selectable text was found. Scanned pages require OCR and are not detected.";
            } else {
                status.textContent = enabled
                    ? "Select text on a page and type to replace it."
                    : "Text editing is off.";
            }
        });

        addTextToggle.addEventListener("click", function() {
            isPlacingText = !isPlacingText;
            addTextToggle.setAttribute("aria-pressed", String(isPlacingText));
            addTextToggle.textContent = isPlacingText ? "Cancel text placement" : "Add text";
            pdfViewer.classList.toggle("placing-text", isPlacingText);
            status.textContent = isPlacingText
                ? "Click a page to place a text box. Press Escape to cancel."
                : "Text placement cancelled.";
        });

        document.addEventListener("keydown", function(event) {
            if (event.key !== "Escape" || !isPlacingText) return;
            isPlacingText = false;
            addTextToggle.setAttribute("aria-pressed", "false");
            addTextToggle.textContent = "Add text";
            pdfViewer.classList.remove("placing-text");
            status.textContent = "Text placement cancelled.";
        });

        drawToggle.addEventListener("click", function() {
            if (isTextEditing) setTextEditMode(false);
            isDrawing = !isDrawing;
            isErasing = false;
            isSelecting = false;
            drawToggle.setAttribute("aria-pressed", String(isDrawing));
            drawToggle.textContent = isDrawing ? "Stop drawing" : "Draw";
            eraseToggle.setAttribute("aria-pressed", "false");
            eraseToggle.textContent = "Erase";
            selectToggle.setAttribute("aria-pressed", "false");
            selectToggle.textContent = "Lasso select";
            pdfViewer.classList.toggle("drawing", isDrawing);
            pdfViewer.classList.remove("erasing");
            pdfViewer.classList.remove("selecting");
        });

        eraseToggle.addEventListener("click", function() {
            if (isTextEditing) setTextEditMode(false);
            isErasing = !isErasing;
            isDrawing = false;
            isSelecting = false;
            eraseToggle.setAttribute("aria-pressed", String(isErasing));
            eraseToggle.textContent = isErasing ? "Stop erasing" : "Erase";
            drawToggle.setAttribute("aria-pressed", "false");
            drawToggle.textContent = "Draw";
            selectToggle.setAttribute("aria-pressed", "false");
            selectToggle.textContent = "Lasso select";
            pdfViewer.classList.toggle("erasing", isErasing);
            pdfViewer.classList.remove("drawing");
            pdfViewer.classList.remove("selecting");
        });

        selectToggle.addEventListener("click", function() {
            if (isTextEditing) setTextEditMode(false);
            isSelecting = !isSelecting;
            isDrawing = false;
            isErasing = false;
            selectToggle.setAttribute("aria-pressed", String(isSelecting));
            selectToggle.textContent = isSelecting ? "Stop selecting" : "Lasso select";
            drawToggle.setAttribute("aria-pressed", "false");
            drawToggle.textContent = "Draw";
            eraseToggle.setAttribute("aria-pressed", "false");
            eraseToggle.textContent = "Erase";
            pdfViewer.classList.toggle("selecting", isSelecting);
            pdfViewer.classList.remove("drawing");
            pdfViewer.classList.remove("erasing");
        });

        inkThickness.addEventListener("input", function() {
            inkThicknessValue.value = `${inkThickness.value} pt`;
            inkThicknessValue.textContent = `${inkThickness.value} pt`;
        });

        downloadPdfButton.addEventListener("click", async function() {
            if (!pdfDocument || isUpdating || activeStrokeCount > 0) {
                status.textContent = "Finish the current stroke before downloading the PDF.";
                return;
            }

            downloadPdfButton.disabled = true;
            try {
                const exportDocument = await PDFLib.PDFDocument.load(await pdfDocument.save());
                const embeddedFonts = new Map();
                drawingsByPage.forEach((strokes, pageIndex) => {
                    const page = exportDocument.getPage(pageIndex);
                    drawStrokesOnPdf(page, strokes);
                });
                for (let pageIndex = 0; pageIndex < textRunsByPage.length; pageIndex++) {
                    await drawTextEditsOnPdf(
                        exportDocument,
                        exportDocument.getPage(pageIndex),
                        textRunsByPage[pageIndex] || [],
                        embeddedFonts
                    );
                }
                const pdfBytes = await exportDocument.save();
                const downloadUrl = URL.createObjectURL(
                    new Blob([pdfBytes], { type: "application/pdf" })
                );
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = pdfFileName;
                link.click();
                setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
                status.textContent = `Downloaded ${pdfFileName}.`;
            } catch (error) {
                status.textContent = `Unable to download the PDF: ${error.message}`;
            } finally {
                downloadPdfButton.disabled = false;
            }
        });

        pdfViewer.addEventListener("click", async function(event) {
            const button = event.target.closest(".page-editor-control");
            if (!button || !pdfDocument || isUpdating) return;

            const pageIndex = Number(button.dataset.pageIndex);
            if (button.classList.contains("page-add")) {
                try {
                    const pageToCopy = pdfDocument.getPage(pageIndex);
                    const { width, height } = pageToCopy.getSize();
                    recordHistory(captureHistoryState());
                    pdfDocument.insertPage(pageIndex + 1, [width, height]);
                    drawingsByPage.splice(pageIndex + 1, 0, []);
                    selectedStrokesByPage.splice(pageIndex + 1, 0, new Set());
                    textRunsByPage.splice(pageIndex + 1, 0, undefined);
                    await updateDocument(pageIndex + 1);
                } catch (error) {
                    status.textContent = `Unable to add a page: ${error.message}`;
                }
                return;
            }

            if (button.classList.contains("page-remove") && pdfDocument.getPageCount() > 1) {
                try {
                    recordHistory(captureHistoryState());
                    pdfDocument.removePage(pageIndex);
                    drawingsByPage.splice(pageIndex, 1);
                    selectedStrokesByPage.splice(pageIndex, 1);
                    textRunsByPage.splice(pageIndex, 1);
                    await updateDocument(Math.min(pageIndex, pdfDocument.getPageCount() - 1));
                } catch (error) {
                    status.textContent = `Unable to remove a page: ${error.message}`;
                }
            }
        });
    </script>
</body>
</html>
